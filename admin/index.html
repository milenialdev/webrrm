<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de contingut — Rehabilitacions Ruíz Marín</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.16.3/dist/decap-cms.js"></script>
  <script type="module">
    import "./preview.js";

    try {
      const { ca } = await import("https://unpkg.com/decap-cms-locales@3.8.2/dist/esm/index.js");
      const widgets = ca.editor?.editorWidgets ?? {};
      CMS.registerLocale("ca", {
        ...ca,
        editor: {
          ...ca.editor,
          editorWidgets: {
            ...widgets,
            list: { ...widgets.list, add: "Afegir %{item}", addType: "Afegir %{item}" },
          },
        },
      });
    } catch (err) {
      console.warn("No s'ha pogut carregar la traducció completa; s'usa la de sèrie.", err);
    }

    CMS.init();
  </script>
</body>
</html>
