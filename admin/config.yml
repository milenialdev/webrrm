backend:
  name: github
  repo: milenialdev/webrrm
  branch: main
  base_url: https://webrrm.carlosbenitoandev.workers.dev
  auth_endpoint: api/auth

locale: "ca"
site_url: https://webrrm.carlosbenitoandev.workers.dev
logo:
  src: /assets/logo-horizontal.svg
  show_in_header: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 80
  width: 1600

collections:
  - name: "site"
    label: "Pàgina d'inici"
    description: "Textos i fotos de la portada, «Qui som» i el contacte."
    files:
      - name: "general"
        label: "Textos de la pàgina d'inici"
        file: "content/site.json"
        fields:
          - label: "Portada"
            name: "hero"
            widget: "object"
            hint: "El títol es forma amb 5 peces seguides: «Tens un [projecte] en ment? Nosaltres / tenim la [solució].» Les paraules destacades surten en cursiva de color."
            fields:
              - { label: "Títol: començament", name: "title_line1", widget: "string" }
              - { label: "Títol: paraula destacada en verd", name: "title_highlight1", widget: "string" }
              - { label: "Títol: continuació", name: "title_line2", widget: "string" }
              - { label: "Títol: segona línia", name: "title_line3", widget: "string" }
              - { label: "Títol: paraula destacada en terracota", name: "title_highlight2", widget: "string" }
              - { label: "Text sota el títol", name: "subtitle", widget: "text" }
              - { label: "Botó principal (verd)", name: "cta_primary", widget: "string" }
              - { label: "Botó secundari (blanc)", name: "cta_secondary", widget: "string" }
              - { label: "Foto de portada", name: "image", widget: "image", required: false, hint: "Millor una foto horitzontal. Es fa més petita i lleugera automàticament en pujar-la." }
          - label: "Qui som"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Text petit sobre el títol", name: "tag", widget: "string" }
              - { label: "Títol", name: "title", widget: "string" }
              - { label: "Part destacada del títol (cursiva)", name: "title_highlight", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Frase destacada", name: "quote", widget: "string" }
              - label: "Foto (treballadors a l'obra)"
                name: "photo"
                widget: "object"
                fields:
                  - { label: "Text mentre no hi ha foto", name: "label", widget: "string" }
                  - { label: "Foto", name: "image", widget: "image", required: false }
              - label: "Xifres"
                name: "stats"
                widget: "list"
                label_singular: "xifra"
                summary: "{{fields.value}} · {{fields.label}}"
                fields:
                  - { label: "Número", name: "value", widget: "string", hint: "Per exemple: +500, 98% o 20" }
                  - { label: "Descripció", name: "label", widget: "string" }
          - label: "Contacte"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Títol", name: "title", widget: "string" }
              - { label: "Part destacada del títol (cursiva)", name: "title_highlight", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Adreça", name: "address", widget: "string" }
              - { label: "Telèfon", name: "phone", widget: "string" }
              - { label: "Correu electrònic", name: "email", widget: "string" }
              - { label: "Horari", name: "hours", widget: "string" }
              - { label: "Nota sota el formulari", name: "form_note", widget: "string" }
          - label: "Peu de pàgina"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Descripció", name: "description", widget: "text" }
              - { label: "Text legal", name: "legal", widget: "string" }

  - name: "services"
    label: "Serveis"
    description: "Els serveis que es mostren a la web."
    files:
      - name: "services"
        label: "Serveis"
        file: "content/services.json"
        fields:
          - { label: "Text petit sobre el títol", name: "tag", widget: "string" }
          - { label: "Títol", name: "title", widget: "string" }
          - { label: "Part destacada del títol (cursiva verda)", name: "title_highlight", widget: "string" }
          - { label: "Text sota el títol", name: "subtitle", widget: "text" }
          - label: "Servei destacat (targeta gran)"
            name: "featured"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Títol", name: "title", widget: "string" }
              - label: "Icona"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Edifici", value: "building" }
                  - { label: "Gota (impermeabilització)", value: "droplet" }
                  - { label: "Sol (aïllament tèrmic)", value: "sun" }
                  - { label: "Persones (comunitats)", value: "people" }
                  - { label: "Document (permisos)", value: "document" }
                  - { label: "Pot de pintura", value: "brush" }
                  - { label: "Columnes (estructures)", value: "beam" }
              - { label: "Punts de la llista", name: "items", widget: "list", label_singular: "punt" }
              - { label: "Text de l'enllaç", name: "link", widget: "string" }
              - { label: "Foto", name: "image", widget: "image", required: false }
          - label: "Targetes de serveis"
            name: "items"
            widget: "list"
            label_singular: "servei"
            summary: "{{fields.title}}"
            fields:
              - { label: "Títol", name: "title", widget: "string" }
              - label: "Icona"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Edifici", value: "building" }
                  - { label: "Gota (impermeabilització)", value: "droplet" }
                  - { label: "Sol (aïllament tèrmic)", value: "sun" }
                  - { label: "Persones (comunitats)", value: "people" }
                  - { label: "Document (permisos)", value: "document" }
                  - { label: "Pot de pintura", value: "brush" }
                  - { label: "Columnes (estructures)", value: "beam" }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Color de la targeta"
                name: "style"
                widget: "select"
                default: "light"
                options:
                  - { label: "Blanca", value: "light" }
                  - { label: "Verd blau", value: "dark-teal" }
                  - { label: "Terracota", value: "terracotta" }

  - name: "projects"
    label: "Projectes"
    description: "Els treballs que es mostren a la web. Els 3 més recents surten a l'inici."
    files:
      - name: "projects"
        label: "Projectes"
        file: "content/projects.json"
        fields:
          - { label: "Text petit sobre el títol", name: "tag", widget: "string" }
          - { label: "Títol", name: "title", widget: "string" }
          - { label: "Part destacada del títol (cursiva verda)", name: "title_highlight", widget: "string" }
          - { label: "Text sota el títol", name: "subtitle", widget: "text" }
          - label: "Projectes"
            name: "items"
            widget: "list"
            label_singular: "projecte"
            summary: "{{fields.title}} · {{fields.location}}"
            add_to_top: true
            fields:
              - { label: "Títol", name: "title", widget: "string" }
              - { label: "Població", name: "location", widget: "string" }
              - { label: "Categoria", name: "category", widget: "string", hint: "El text petit en majúscules que surt sobre el títol de la targeta." }
              - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: true, hint: "Serveix per ordenar: els més recents surten primer." }
              - label: "Etiquetes (per filtrar a «Tots els projectes»)"
                name: "tags"
                widget: "relation"
                collection: "tags"
                file: "tags"
                search_fields: ["tags.*.name"]
                display_fields: ["tags.*.name"]
                value_field: "tags.*.name"
                multiple: true
                required: false
                hint: "Tria una o més. Si no surt la que busques, afegeix-la abans a «Etiquetes dels projectes»."
              - label: "Fotos (màxim 5)"
                name: "images"
                widget: "list"
                max: 5
                required: false
                label_singular: "foto"
                hint: "Puja fins a 5 fotos. Es fan més petites i lleugeres soles en pujar-les. La primera és la que es veu a la targeta."
                field: { label: "Foto", name: "image", widget: "image" }

  - name: "tags"
    label: "Etiquetes dels projectes"
    description: "Les etiquetes que es poden triar als projectes. Surten com a filtres a «Tots els projectes»."
    files:
      - name: "tags"
        label: "Etiquetes"
        file: "content/tags.json"
        fields:
          - label: "Etiquetes"
            name: "tags"
            widget: "list"
            label_singular: "etiqueta"
            summary: "{{fields.name}}"
            hint: "Si canvies el nom d'una etiqueta, torna a triar-la als projectes que la fan servir."
            fields:
              - { label: "Nom", name: "name", widget: "string" }
